name: docker-publish

# 在 GitHub Actions 云端构建多架构镜像（amd64 + arm64）并推送 GHCR，
# 服务器上只用 docker pull，严禁在 VPS 本地编译。
# 镜像: ghcr.io/<owner>/aura:latest

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'aura-rs/**'
      - 'index.html'
      - 'static/**'
  workflow_dispatch:

jobs:
  rust-test:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aura-rs -> target
      - name: cargo test
        working-directory: aura-rs
        run: cargo test --lib

  python-test:
    name: Python Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-subtests pytest-asyncio
      - name: Run Python regressions (exclude browser)
        env:
          PYTHONPATH: .
        run: |
          pytest -v --ignore=tests/test_frontend_browser.py

  build-push:
    name: Build & Push Image
    needs: [rust-test, python-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR 默认私有，VPS 匿名 pull 需要公开（幂等，重复设置无害）
      # 用 repo-scoped API：GITHUB_TOKEN 是 repo 身份，user-scoped 会 404（包归仓库所有者）
      - name: Set package visibility public
        run: |
          curl -s -o /dev/null -w "visibility patch HTTP %{http_code}\n" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/packages/container/aura" \
            -d '{"visibility":"public"}'
